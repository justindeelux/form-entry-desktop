name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version: v$version" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows installer and portable ZIP
        run: npm run make -- --platform=win32 --arch=x64
      - name: Check packaged app with local fixtures
        run: node tests/packaged-smoke.cjs "out/Form Entry Desktop-win32-x64/FormEntryDesktop.exe"
      - name: Check shutdown safety
        run: node tests/packaged-close.cjs "out/Form Entry Desktop-win32-x64/FormEntryDesktop.exe"
      - name: Install and check Windows app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'out/make/nsis/*Setup-*.exe').FullName
          if (-not (Test-Path 'out/make/nsis/latest.yml')) { throw 'Missing public update metadata' }
          if (-not (Test-Path "$setup.blockmap")) { throw 'Missing installer blockmap' }
          $root = Join-Path $env:RUNNER_TEMP 'Custom Install\FormEntryDesktop'
          ./tests/installer-wizard.ps1 -Setup $setup -InstallDir $root
          $exe = Join-Path $root 'FormEntryDesktop.exe'
          $uninstaller = Join-Path $root 'Uninstall FormEntryDesktop.exe'
          if (-not (Test-Path $exe)) { throw 'Missing executable in custom install folder' }
          if (-not (Test-Path $uninstaller)) { throw 'Missing NSIS uninstaller' }
          if (-not (Test-Path (Join-Path $root 'resources/app-update.yml'))) { throw 'Missing updater configuration' }
          node tests/packaged-smoke.cjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke check failed' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$root") -PassThru
          if (-not $uninstall.WaitForExit(120000)) { throw 'Uninstaller timed out' }
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'Uninstall did not remove the installed app' }
      - uses: actions/upload-artifact@v7
        with:
          name: Form-Entry-Desktop-Windows-x64
          path: |
            out/make/nsis/*.exe
            out/make/nsis/*.blockmap
            out/make/nsis/latest.yml
            out/make/zip/win32/x64/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Form-Entry-Desktop-Windows-x64
          path: release
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -Recurse -File | ForEach-Object { $_.FullName })
          foreach ($pattern in @('latest.yml', '*Setup-*.exe', '*.blockmap', '*.zip')) {
            if (-not (Get-ChildItem release -Recurse -File -Filter $pattern)) { throw "Missing release asset: $pattern" }
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "Form Entry Desktop $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
