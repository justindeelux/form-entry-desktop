name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build Windows x64
        run: npm run make -- --platform=win32 --arch=x64
      - name: Check packaged app with local fixtures
        run: node tests/packaged-smoke.cjs "out/Form Entry Desktop-win32-x64/Form Entry Desktop.exe"
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Form-Entry-Desktop-Windows-x64
          path: out/make/zip/win32/x64/*.zip
          if-no-files-found: error
